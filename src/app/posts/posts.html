<h1 class="text-4xl font-bold text-center my-8">
  Welcome to Our Posts
</h1>

<h2 class="text-2xl container mx-auto flex gap-4 items-center">
  Posts
  <span class="badge badge-secondary"
    >{{ postsService.posts().length }}</span
  >
</h2>

<section class="my-4">
  @if (postsService.error()) {
    <div class="alert alert-error">
      <p>Error loading posts: {{ postsService.error() }}</p>
    </div>
  } @else if (
    postsService.isLoading() && postsService.posts().length === 0
  ) {
    <app-loading-indicator />
  } @else {
    <app-posts-list />
  }
</section>
