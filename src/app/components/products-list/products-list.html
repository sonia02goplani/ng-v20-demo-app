<ul class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
  @for (product of products(); track product.id) {
  <li class="product-item">
    <div class="card bg-base-100 max-w-96 shadow-sm h-full">
      <figure>
        <img
          src="{{ product.image }}"
          class="w-full h-48 object-cover"
          loading="lazy"
          alt="{{ product.name }}"
        />
      </figure>
      <div class="card-body">
        <h2 class="card-title">{{product.name}}</h2>
        <p>{{product.description}}</p>
        <p class="text-lg font-bold">Price: ${{product.price.toFixed(2)}}</p>
        <div class="flex justify-end mt-4">
          <span class="badge badge-secondary"
            >Category: {{product.category}}</span
          >
        </div>
        <div class="card-actions justify-end">
          <button
            type="button"
            class="btn gap-2 border-0 bg-sky-200 font-medium text-sky-900 shadow-sm hover:bg-sky-300 active:bg-sky-400"
            (click)="addToCart(product)"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="h-5 w-5"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121 0 1.839-1.179 1.332-2.126L16.164 6H5.25M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z"
              />
            </svg>
            Add to cart
          </button>
        </div>
      </div>
    </div>
  </li>
  } @empty {
  <div class="alert alert-info">
    <p>No products available.</p>
  </div>
  }
</ul>
