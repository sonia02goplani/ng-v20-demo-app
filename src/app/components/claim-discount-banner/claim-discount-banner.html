<div class="bg-base-200 rounded-box px-6 py-4 shadow-sm flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
  <div class="space-y-1">
    <p class="text-lg font-semibold">Claim your discount 15% off</p>
    <p class="text-sm text-base-content/70">
      Activate the offer to lock in the savings for the next 5 minutes.
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-3">
    <button type="button" class="btn btn-primary btn-sm" (click)="stopCountdown()">
      Click here
    </button>

    @if (remainingSeconds() === null) {
      <span class="text-sm text-base-content/70">Timer starts when the banner loads.</span>
    } @else if (remainingSeconds()! > 0) {
      <span class="text-sm font-semibold" aria-live="polite">
        Time left: {{ formattedTime() }}
      </span>
    } @else {
      <span class="text-sm font-semibold text-error">Offer expired.</span>
    }
  </div>
</div>
